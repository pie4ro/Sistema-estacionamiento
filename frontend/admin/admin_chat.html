<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkAccess | Chat Administrador</title>

    <link rel="stylesheet" href="../styles.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="dashboard-page">

<div class="dashboard-layout">

    <aside class="sidebar">
        </aside>

    <main class="dashboard-main">
        <div class="dashboard-top">
            <div>
                <h2>Chat Administrador</h2>
                <p>Conversa con otros clientes registrados en el sistema, cualquier cosa, estarás para servir.</p>
            </div>
            <a href="admin_dashboard.html" class="back-btn">Volver al panel</a>
        </div>

        <div class="chat-container">
            <div class="chat-users">
                <h2>Clientes</h2>

                <input
                    type="text"
                    id="buscarClienteChat"
                    placeholder="Buscar cliente..."
                    style="width: 100%; padding: 12px 16px; margin-bottom: 15px; border-radius: 14px; border: 1px solid #d1d5db; background: #f8fafc; color: #111827; font-size: 14px; outline: none; box-sizing: border-box;"
                >

                <div id="listaClientesChat" class="chat-users-list">
                    </div>
            </div>

            <div class="chat-box">
                <div class="chat-header" id="chatHeader">
                    <img src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Avatar">
                    <div>
                        <h2 style="margin: 0; font-size: 18px; color: #111827;">Selecciona un cliente</h2>
                        <small style="color: #6b7280; font-size: 13px;">Sin conversación iniciada</small>
                    </div>
                </div>

                <div id="mensajesAdmin" class="mensajes">
                    </div>

                <div class="chat-input">
                    <input
                        type="text"
                        id="txtMensajeAdmin"
                        placeholder="Escribe un mensaje..."
                    >
                    <button id="btnEnviarAdmin">
                        Enviar
                    </button>
                </div>
            </div>
        </div>
    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/admin_chat.js"></script>

</body>

</html>
