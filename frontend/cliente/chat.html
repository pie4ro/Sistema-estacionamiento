<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkAccess | Chat</title>
    <link rel="stylesheet" href="../styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-page">

<div class="dashboard-layout">
    <aside class="sidebar">
        </aside>

    <main class="dashboard-main">
        <div class="dashboard-top">
            <div>
                <h2>Chat para comunicaciones</h2>
                <p>Conversa con otros clientes registrados en el sistema.</p>
                <p>Nota: !Evita comentarios inapropiados¡</p>
            </div>
            <a href="dashboard.html" class="back-btn">Volver al panel</a>
        </div>

        <div class="chat-container">
            <div class="chat-users">
                <h2>Clientes</h2>
                <div id="listaUsuarios" class="chat-users-list">
                    </div>
            </div>

            <div class="chat-box">
                <div class="chat-header">
                    <img id="chatFoto" src="https://cdn-icons-png.flaticon.com/512/847/847969.png" alt="Foto">
                    <div>
                        <h2 id="chatNombre">Selecciona un usuario para comenzar a chatear</h2>
                        <small id="chatEstado">Sin conversación iniciada</small>
                    </div>
                </div>

                <div id="mensajes" class="mensajes">
                    </div>

                <div class="chat-input">
                    <input id="txtMensaje" type="text" placeholder="Escribe un mensaje...">
                    <button id="btnEnviar">Enviar</button>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase.js"></script>
<script src="../js/chat.js"></script>
</body>
</html>
